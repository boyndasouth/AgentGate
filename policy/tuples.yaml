# Seed tuples for the demo. Single source of truth:
# used by tests.fga.yaml (tuple_file) and by scripts/load_store.py.

# --- Owners: every agent is a real identity with a human owner ---
- user: user:shiwin
  relation: owner
  object: agent:researcher
- user: user:shiwin
  relation: owner
  object: agent:mailer
- user: user:shiwin
  relation: owner
  object: agent:finance

# --- Approvers: who answers the Slack escalations ---
- user: user:shiwin
  relation: approver
  object: tool:send_email
- user: user:shiwin
  relation: approver
  object: tool:transfer_funds

# --- researcher: browses freely in a clean session (browsing taints the session);
#     once tainted, only allowlisted hosts (a URL can carry data out: G03) ---
- user: agent:researcher
  relation: direct_invoker
  object: tool:read_web
  condition:
    name: untainted_or_allowed_host
    context:
      allowed_hosts: [example.com]

# --- mailer: reads inbox and customers; sends alone only in a clean session AND to an
#     allowlisted (internal) domain; any other send needs a human (closes G01) ---
- user: agent:mailer
  relation: direct_invoker
  object: tool:read_inbox
- user: agent:mailer
  relation: direct_invoker
  object: tool:query_customers
- user: agent:mailer
  relation: direct_invoker
  object: tool:send_email
  condition:
    name: untainted_allowed_recipient
    context:
      allowed_recipient_domains: [agentgate.example]
- user: agent:mailer
  relation: approval_invoker
  object: tool:send_email

# --- finance: pays small invoices alone, in a clean session, to a known payee (closes G04),
#     against an open invoice for that exact amount (closes G05); anything else goes to a human ---
- user: agent:finance
  relation: direct_invoker
  object: tool:transfer_funds
  condition:
    name: within_limit_open_invoice
    context:
      max_amount: 100
      allowed_payees: [acct_acme_supplies]
- user: agent:finance
  relation: approval_invoker
  object: tool:transfer_funds
