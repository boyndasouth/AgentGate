# Render Blueprint: AgentGate broker + OpenFGA in one free web service (OpenFGA on Supabase, Day 10).
# Database = Supabase (session pooler). Secrets are entered in the dashboard (sync: false).
services:
  - type: web
    name: agentgate-broker
    runtime: docker
    plan: free
    region: virginia            # pick the Render region closest to your Supabase region
    dockerfilePath: ./deploy/render/Dockerfile
    buildFilter:
      paths:
        - broker/**
        - policy/**
        - deploy/render/**
        - render.yaml
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      - key: OPENFGA_VERSION     # informational; the image tag is pinned in the Dockerfile ARG
        value: v1.22.1
      # Supabase -> Connect -> Session pooler (port 5432), plus ?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Day 10: OpenFGA keeps its tuples in Supabase under its own `openfga` role and schema,
      # created at boot from DATABASE_URL (see deploy/render/README.md). A new random password,
      # 16+ characters. Unset = in-memory OpenFGA (delegations end at the next restart).
      - key: FGA_DB_PASSWORD
        sync: false
      - key: AGENTGATE_SIGNING_KEY
        sync: false
      - key: AGENTGATE_ADMIN_KEY
        sync: false
      - key: AGENTGATE_ORCHESTRATOR_KEY
        sync: false
      - key: AGENTGATE_ARGS_HMAC_KEY
        sync: false
      # Day 4: Slack approvals, HTTP mode (prod Slack app). Never set SLACK_APP_TOKEN here:
      # it would switch the broker to Socket Mode. See deploy/slack/README.md.
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_APPROVALS_CHANNEL
        sync: false
      - key: SLACK_APPROVERS        # e.g. U0123ABCD=shiwin
        sync: false
      - key: APPROVAL_TTL_SECONDS
        value: "120"
      # Day 13: agents log in as themselves with an Auth0 machine-to-machine token
      # (deploy/auth0/README.md). AUTH0_DOMAIN is the tenant domain (dev-abc123.us.auth0.com, no
      # https://); AUTH0_AUDIENCE is the identifier of the "AgentGate API" you create in Auth0.
      # Leave both unset and POST /tokens/agent answers 503; everything else works as before.
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_AUDIENCE
        sync: false
      # Day 12: credentials for http tools, one secret per upstream, named UPSTREAM_<NAME>; a tool
      # row's credential_ref names the variable. Add each one in the dashboard when you need it
      # (adding a variable redeploys). Example:
      # - key: UPSTREAM_GITHUB_TOKEN
      #   sync: false
      # Only if your broker/Dockerfile starts the app differently:
      # - key: BROKER_CMD
      #   value: uvicorn app.main:app --host 0.0.0.0 --port 8000
